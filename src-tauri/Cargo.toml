[package]
name = "ai-meeting-workstation"
version = "0.9.1"
description = "AI Meeting Workstation desktop shell"
edition = "2021"
# 声明了 [[bin]] 之后 cargo 不再能唯一推断主程序，必须用 default-run 指明
# 「AI Meeting Workstation」这个入口就是 src/main.rs 那个 bin（键在 [package] 里），
# 否则 tauri build 会报 failed to find main binary。
default-run = "aimw"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 仅 updater_probe 用来复现插件的 HTTP 请求（排查 "Could not fetch..."）
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-tls"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"

# 验收探针（src/bin/updater_probe.rs）需要自己起一个 current-thread 运行时：
# 探针里同步等异步，不能复用主程序的 async runtime。
tokio = { version = "1", features = ["rt", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# 验收探针只用于发布验收，不随产品分发。
# 显式声明主程序：tauri build 需要能从 bin 列表里定位到带 tauri::Builder 的入口。
[[bin]]
name = "aimw"
path = "src/main.rs"

[[bin]]
name = "updater_probe"
path = "src/bin/updater_probe.rs"
required-features = []
